name: Validate docs

# Fast pre-merge gate. Runs on EVERY pull request and EVERY push to main —
# deliberately WITHOUT a `paths:` filter. Catches broken YAML frontmatter BEFORE
# it reaches the non-strict mkdocs build, where it would otherwise render a pink
# parse banner on GitHub and silently drop <meta name="description"> tags.
#
# Why no `paths:` filter (hardened 2026-06-26): a path-filtered gate gives a
# false sense of safety. A direct push to main carrying broken frontmatter
# (e.g. the dd4ce68 em-dash sweep that flattened hermes/index.md and broke a
# skills page) slipped through and turned main red with NO Validate-docs run
# recorded for that push. The marketplace/SEO sweeps push straight to main and
# touch hundreds of .md files at once, so the cost of running this ~12-second
# check unconditionally is trivial next to the cost of a silent break that
# blocks every subsequent docs PR. Run it on everything; never gate it behind a
# path glob that can fail to match or fail to evaluate on a given push.
#
# This is deliberately separate from pages.yml (the deploy workflow): it gives
# PRs a quick green/red check without doing a full site build, and it runs on
# the direct-push-to-main vector too.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node for search runtime regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml jinja2

      - name: Validate docs search URL resolution
        run: python -m unittest scripts/test_search_navigation.py

      - name: Validate frontmatter
        run: python scripts/validate_frontmatter.py

      - name: Validate frontmatter quote and date gate
        run: python -m unittest scripts/test_validate_frontmatter_quotes.py

      - name: Validate Vercel deployment packaging
        run: python -m unittest scripts/test_vercel_deploy.py

      # A redirect is evaluated before the filesystem, so a redirect whose
      # source matches a real page hides that page, and one whose destination
      # has no page 404s the reader. Both happened on 2026-11-04 (the Klaviyo
      # ChatGPT page was dead on docs.corpusiq.io while 200 on the www proxy).
      - name: Validate redirect map does not shadow or strand pages
        run: python -m unittest scripts/test_redirect_shadow.py

      - name: Validate no-slash normalize gate
        run: python -m unittest scripts/test_normalize_site_no_slash.py

      - name: Validate docs asset name stabilization
        run: python -m unittest scripts/test_stabilize_hashed_assets.py

      - name: Validate docs internal link absolutization
        run: python -m unittest scripts/test_absolutize_internal_links.py

      - name: Reject blanket data-retention claims
        run: |
          python scripts/validate_retention_claims.py
          python -m unittest scripts/test_validate_retention_claims.py

      # The repo root carries a maintained mirror of the docs tree that MkDocs
      # never builds. Nothing enforced parity, and api/*.md had already drifted
      # a full generation behind docs/api/*.md while still being public in the
      # repository. See scripts/check_mirror_parity.py for the full history.
      - name: Validate root/docs mirror parity
        run: python scripts/check_mirror_parity.py

      # The skills sweep lane publishes a batch page plus one line in the
      # marketplace "Recent Sweeps" index. The index append silently stopped on
      # 2026-11-06: the November 5 evening and November 6 morning batch pages
      # were live in the sitemap but linked from nowhere in the site, so no
      # reader browsing the marketplace could reach the newest sweeps. Nothing
      # caught it because every URL still returned 200. See
      # scripts/check_sweep_index_links.py.
      - name: Validate every recent skills sweep page is indexed
        run: |
          python -m unittest scripts/test_check_sweep_index_links.py
          python scripts/check_sweep_index_links.py

      # A `---` with no blank line above it is a setext heading underline, not a
      # horizontal rule, so the sentence above it renders as an H2. Measured on
      # production 2026-11-07: /docs/hermes/prompts published its credit line as
      # the heading "From the Hermes Prompt Collection - production prompts for
      # AI agents. Powered by CorpusIQ.", and the same shape appeared across the
      # skills catalog ("Powered by CorpusIQ", "Part of the Hermes Skills
      # Library - ..."). 407 rules across 394 files were affected. The junk
      # heading also enters the page table of contents, which is the outline an
      # AI assistant extracts. See scripts/check_setext_rules.py.
      - name: Validate no setext rule swallows a sentence into a heading
        run: |
          python -m unittest scripts/test_check_setext_rules.py
          python scripts/check_setext_rules.py

      # PROGRESS.md opens with five file counts, and they are the one number on
      # that page a reader can check with a single command. They are typed by
      # hand mid-cycle while the cycle's own merges keep landing, so on
      # 2026-11-07 #239 stated 3,633 and 1,519 - the values from 608cff9 - and
      # merged after #237 had added three more files. Nothing failed, because
      # nothing read the block. scripts/check_progress_counts.py derives all
      # five from git ls-files. A claim it cannot parse is skipped, never
      # failed, so rewording the block does not turn this red.
      - name: Validate PROGRESS.md file counts match the tree
        run: |
          python -m unittest scripts/test_check_progress_counts.py
          python scripts/check_progress_counts.py

      # MkDocs builds non-strict, so a stray ` or an unclosed ** publishes
      # silently and reads as broken text to every visitor. Found on production
      # 2026-11-08: /docs/hermes/mcp/servers/external/dutykit-mcp rendered the
      # literal "**0.1.1`), which reads as a rename in progress" (stray backtick
      # after 0.1.1) and /docs/hermes/mcp/servers/external/adrio-mcp rendered
      # "**The key advantage is ..." because its bold opener was closed with
      # </b> instead of **. Both returned 200; no gate looked at inline
      # emphasis. scripts/check_emphasis_markers.py strips fenced blocks and
      # balanced code spans, then requires an even count of ** and zero leftover
      # backticks. See its docstring for the rule and the two worked examples.
      - name: Validate emphasis and inline-code markers are balanced
        run: |
          python -m unittest scripts/test_check_emphasis_markers.py
          python scripts/check_emphasis_markers.py

      - name: Validate generated llms feeds are in sync
        # The deploy gate refuses to publish when llms.txt / llms-full.txt do not
        # match the tree, but that check lived ONLY in the deploy workflows, so a
        # push that added pages without regenerating the feeds turned main undeployable
        # (77e510aa, 2026-11-08: every deploy blocked until d381684d regenerated them).
        # Catching it here makes the PR red BEFORE the merge instead of stalling production.
        run: |
          python scripts/generate_llms_txt.py
          git diff --exit-code -- llms.txt llms-full.txt
