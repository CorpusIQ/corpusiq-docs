name: Validate docs

# Fast pre-merge gate. Runs on EVERY pull request and EVERY push to main —
# deliberately WITHOUT a `paths:` filter. Catches broken YAML frontmatter BEFORE
# it reaches the non-strict mkdocs build, where it would otherwise render a pink
# parse banner on GitHub and silently drop <meta name="description"> tags.
#
# Why no `paths:` filter (hardened 2026-06-26): a path-filtered gate gives a
# false sense of safety. A direct push to main carrying broken frontmatter
# (e.g. the dd4ce68 em-dash sweep that flattened hermes/index.md and broke a
# skills page) slipped through and turned main red with NO Validate-docs run
# recorded for that push. The marketplace/SEO sweeps push straight to main and
# touch hundreds of .md files at once, so the cost of running this ~12-second
# check unconditionally is trivial next to the cost of a silent break that
# blocks every subsequent docs PR. Run it on everything; never gate it behind a
# path glob that can fail to match or fail to evaluate on a given push.
#
# This is deliberately separate from pages.yml (the deploy workflow): it gives
# PRs a quick green/red check without doing a full site build, and it runs on
# the direct-push-to-main vector too.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node for search runtime regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml jinja2

      - name: Validate docs search URL resolution
        run: python -m unittest scripts/test_search_navigation.py

      - name: Validate frontmatter
        run: python scripts/validate_frontmatter.py

      - name: Validate frontmatter quote and date gate
        run: python -m unittest scripts/test_validate_frontmatter_quotes.py

      - name: Validate Vercel deployment packaging
        run: python -m unittest scripts/test_vercel_deploy.py

      # A redirect is evaluated before the filesystem, so a redirect whose
      # source matches a real page hides that page, and one whose destination
      # has no page 404s the reader. Both happened on 2026-11-04 (the Klaviyo
      # ChatGPT page was dead on docs.corpusiq.io while 200 on the www proxy).
      - name: Validate redirect map does not shadow or strand pages
        run: python -m unittest scripts/test_redirect_shadow.py

      - name: Validate no-slash normalize gate
        run: python -m unittest scripts/test_normalize_site_no_slash.py

      - name: Validate docs asset name stabilization
        run: python -m unittest scripts/test_stabilize_hashed_assets.py

      - name: Validate docs internal link absolutization
        run: python -m unittest scripts/test_absolutize_internal_links.py

      - name: Reject blanket data-retention claims
        run: |
          python scripts/validate_retention_claims.py
          python -m unittest scripts/test_validate_retention_claims.py

      # The repo root carries a maintained mirror of the docs tree that MkDocs
      # never builds. Nothing enforced parity, and api/*.md had already drifted
      # a full generation behind docs/api/*.md while still being public in the
      # repository. See scripts/check_mirror_parity.py for the full history.
      - name: Validate root/docs mirror parity
        run: python scripts/check_mirror_parity.py

