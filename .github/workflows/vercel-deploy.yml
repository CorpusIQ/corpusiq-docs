name: Deploy docs to production Vercel

# Issue #99: production docs live at https://docs.corpusiq.io (Vercel project
# prj_sKOYMEdaQZjCcJwYDgfb4KN61na2), proxied from https://www.corpusiq.io/docs/*.
# GitHub Pages (pages.yml) is staging-only and must not be reported as
# production publication. This workflow makes a merge to main the production
# publication path: build MkDocs, copy the llms feeds into site/, deploy to
# the existing Vercel project, then probe both public URLs for a known marker.
#
# Required repository secrets:
#   VERCEL_TOKEN      — Vercel API token (from ~/.hermes/profiles/corpusiq/secrets/vercel.json)
#   VERCEL_ORG_ID     — team slug/id ("corpus-iq")
#   VERCEL_PROJECT_ID — prj_sKOYMEdaQZjCcJwYDgfb4KN61na2
#
# Deployment failures are loud: any failed step or failed probe fails this
# workflow, so a green Pages run alone can never be mistaken for production.

on:
  push:
    branches: [main]
    paths:
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'vercel.json'
      - '.github/workflows/pages.yml'
      - '.github/workflows/vercel-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize production deploys; never cancel one in flight.
concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate frontmatter
        run: python scripts/validate_frontmatter.py

      - name: Validate public retention claims and generated feeds
        run: |
          python scripts/validate_retention_claims.py
          python -m unittest scripts/test_validate_retention_claims.py
          python scripts/generate_llms_txt.py
          git diff --exit-code -- llms.txt llms-full.txt

      - name: Build site
        run: mkdocs build --site-dir ./site

      - name: Package Vercel configuration and llms feeds
        # `deploy site` makes site/ the project root. Without this config,
        # Vercel defaults to public/ and loses our redirects/asset rewrites.
        run: cp vercel.json llms.txt llms-full.txt site/

      # The platform build needs an explicit output directory: without the
      # bundled vercel.json it defaults to "public" and fails with
      # STATIC_BUILD_NO_OUT_DIR ("No Output Directory named public"). The file
      # also ships the production redirects/rewrites. Mirrors deploy_docs.py.
      - name: Copy vercel.json into site
        run: cp vercel.json site/vercel.json

      # Merge-path hardening (Oct 7, 2026): raw MkDocs output is slashed by
      # default (sitemap <loc> entries, canonical tags, internal hrefs). Both
      # local deploy paths (deploy_docs.py, deploy_vercel_prod.py) normalize
      # and hard-verify before deploying; mirror that gate here so the merge
      # path cannot publish slashed artifacts to production.
      - name: Normalize and verify no-slash invariants
        run: python scripts/normalize_site_no_slash.py site

      # Production serves docs pages without a trailing slash, but raw MkDocs
      # output uses directory-style relative links. Absolutize internal links
      # to /docs/* so nav cannot resolve one segment too high.
      # deploy_docs.py applied these inline; this path did not, so a CI deploy
      # silently reverted six docs canonicals to self-referencing.
      - name: Apply canonical overrides
        run: python scripts/apply_canonical_overrides.py site

      # A sitemap lists URLs a crawler should index, so a page that canonicals
      # elsewhere must not be in it. Ahrefs scores that as an Error.
      - name: Prune non-canonical sitemap entries
        run: python scripts/prune_non_canonical_sitemap_entries.py site

      - name: Absolutize internal docs links
        run: python scripts/absolutize_internal_links.py site

      # MkDocs hash filenames rotate on each build while docs HTML can be edge
      # cached. Stabilize asset names so cached HTML keeps resolving files.
      - name: Stabilize hashed asset names
        run: python scripts/stabilize_hashed_assets.py site

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest deploy site --yes --prod \
            --token "$VERCEL_TOKEN" \
            --team "$VERCEL_ORG_ID"

      - name: Probe production markers
        run: |
          python - <<'EOF'
          import re
          from urllib.parse import urljoin, urlsplit
          import urllib.request

          # Marker: truthful directory disclosure wording shipped by PR #98.
          marker = "control-plane"
          urls = [
              "https://docs.corpusiq.io/security/",
              "https://www.corpusiq.io/docs/security/",
              "https://docs.corpusiq.io/llms.txt",
          ]
          failed = []
          for url in urls:
              try:
                  body = urllib.request.urlopen(url, timeout=30).read().decode("utf-8", "ignore")
                  ok = ("security" in body) if url.endswith("llms.txt") else (marker in body)
              except Exception as exc:
                  ok = False
                  print(f"PROBE FAIL {url}: {exc}")
              print(f"PROBE {'OK  ' if ok else 'FAIL'} {url}")
              if not ok:
                  failed.append(url)

          docs_url = "https://www.corpusiq.io/docs"
          try:
              docs_body = urllib.request.urlopen(docs_url, timeout=30).read().decode("utf-8", "ignore")
          except Exception as exc:
              failed.append(f"{docs_url} (html fetch failed: {exc})")
              docs_body = ""

          local_refs = set()
          for ref in re.findall(r'(?:href|src)=["\']([^"\']+)["\']', docs_body):
              no_fragment = ref.split("#", 1)[0]
              no_query = no_fragment.split("?", 1)[0].lower()
              if not no_query.endswith((".css", ".js")):
                  continue
              parsed = urlsplit(ref)
              if parsed.scheme in ("http", "https") and parsed.hostname not in {"www.corpusiq.io", "docs.corpusiq.io"}:
                  continue
              if ref.startswith("//"):
                  host = urlsplit(f"https:{ref}").hostname
                  if host not in {"www.corpusiq.io", "docs.corpusiq.io"}:
                      continue
                  target = f"https:{ref}"
              elif parsed.scheme in ("http", "https"):
                  target = ref
              else:
                  target = urljoin(docs_url + "/", ref)
              local_refs.add(target)

          asset_failures = []
          for ref in sorted(local_refs):
              try:
                  with urllib.request.urlopen(ref, timeout=30) as response:
                      code = response.getcode()
                      content_type = response.headers.get("content-type", "")
                  ok = code == 200 and "text/html" not in content_type.lower()
                  if not ok:
                      asset_failures.append(f"{ref} (status={code}, content-type={content_type})")
              except Exception as exc:
                  asset_failures.append(f"{ref} ({exc})")

          for item in asset_failures:
              print(f"ASSET FAIL {item}")
          failed.extend(asset_failures)

          if failed:
              raise SystemExit(f"Production probe failed for: {', '.join(failed)}")
          EOF
