name: Build and validate docs (GitHub Pages mirror)

# Builds the MkDocs Material site, runs the content/feeds gates, and prepares
# the Pages artifact. It does NOT publish: GitHub Pages for this repo is
# configured with build_type=legacy on the `gh-pages` branch, and an
# actions/deploy-pages step cannot complete under that setting - it polls the
# Pages deployment API until timeout and reports "Timeout reached, aborting!"
# on every push (runs 41621900687, 41899431721, 42008029731, 42009289326,
# 42137777758 between Nov 3 and Nov 5 2026).
#
# Publication paths (neither of which is this workflow):
#   production  -> vercel-deploy.yml to docs.corpusiq.io / www.corpusiq.io/docs
#   Pages mirror -> scripts/deploy_docs.py (legacy `mkdocs gh-deploy` to gh-pages)
#
# Do not reintroduce a deploy-pages step here without first switching
# Settings -> Pages -> Source to "GitHub Actions" in the same change.

on:
  push:
    branches: [main]
    paths:
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow the workflow to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys; cancel nothing in flight so a running deploy finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # awesome-pages + git-based edit_uri benefit from full history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate frontmatter
        # Hard gate before the (non-strict) build. mkdocs won't fail on broken
        # YAML frontmatter — it silently drops it, losing meta descriptions and
        # rendering a parse banner on GitHub. This step refuses to deploy that.
        run: python scripts/validate_frontmatter.py

      - name: Validate public retention claims and generated feeds
        run: |
          python scripts/validate_retention_claims.py
          python -m unittest scripts/test_validate_retention_claims.py
          python scripts/generate_llms_txt.py
          git diff --exit-code -- llms.txt llms-full.txt

      - name: Build site
        # Non-strict: the docs content currently has a handful of cross-file
        # relative links that MkDocs flags as warnings. Strict mode aborts on
        # those, which would block every deploy. Keep builds shipping; the link
        # warnings are tracked separately as content cleanup.
        run: mkdocs build --site-dir ./site

      # MkDocs stamps every URL with the build date, so the published sitemap
      # claimed all pages changed on every build. Rewrite lastmod from the
      # per-page dates the page_schema hook writes (same as deploy_docs.py and
      # the Vercel workflow).
      - name: Rewrite sitemap lastmod from per-page dates
        run: |
          if [ ! -f site/.page_dates.json ]; then
            echo "::error::site/.page_dates.json missing - page_schema hook did not run, so sitemap lastmod would be build-date stamped"
            exit 1
          fi
          python scripts/rewrite_sitemap_lastmod.py --write

      # Validate the structured data that actually ships. The frontmatter gate
      # catches stray quotes before merge; this one proves the rendered JSON-LD
      # parses, because a value can be legal YAML and still break the page graph
      # (2026-11-05: two pages served `"datePublished": "2026-11-04""` and the
      # Article-only check beside it still reported ok).
      - name: Verify per-page schema and structured data
        run: python scripts/check_page_schema.py

      # Production serves docs pages without a trailing slash, but raw MkDocs
      # output uses directory-style relative links. Absolutize internal links
      # to /docs/* so nav cannot resolve one segment too high.
      - name: Absolutize internal docs links
        run: python scripts/absolutize_internal_links.py site

      # MkDocs hash filenames rotate on each build while docs HTML can stay
      # edge cached. Stabilize names so cached pages keep loading assets.
      - name: Stabilize hashed asset names
        run: python scripts/stabilize_hashed_assets.py site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
